<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kendi Ritminde — Kasa Katkı Takibi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
<style>
  :root {
    --bg: #0D0B14;
    --bg-soft: #16121F;
    --card: #1C1729;
    --line: #2A2340;
    --text: #F3EEFF;
    --muted: #9A90B5;
    --accent: #C9A8FF;
    --accent-2: #7E5BEF;
    --ok: #6EE7B7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(126,91,239,0.20), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px 56px;
    min-height: 100%;
  }
  .wrap { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 28px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 10px;
  }
  h1 { font-size: 24px; font-weight: 700; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.5; }

  .card {
    background: linear-gradient(180deg, var(--card), var(--bg-soft));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 30px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .ring-wrap { display: flex; justify-content: center; margin: 6px 0 22px; }
  .ring { position: relative; width: 220px; height: 220px; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring .track { stroke: var(--line); }
  .ring .bar {
    stroke: url(#grad); stroke-linecap: round;
    transition: stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);
  }
  .ring .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pct { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; }
  .pct span { font-size: 26px; color: var(--muted); font-weight: 700; }
  .pct-label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .updated { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  .updated a { color: var(--accent); text-decoration: none; }

  .state { text-align: center; color: var(--muted); padding: 30px 0; }
  .error { color: #ff9aa2; }
  .skeleton { opacity: 0.5; }

  @media (max-width: 420px) {
    .ring { width: 190px; height: 190px; }
    .pct { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Kendi Ritminde</div>
    <h1>Kasa Katkı Takibi</h1>
    <p class="sub">Buluşmalar sonrası oluşan açığı kapatmak için gönüllü katkılar</p>
  </header>

  <div class="card" id="card">
    <div class="state" id="state">Yükleniyor…</div>
  </div>

  <p class="updated" id="updated"></p>
</div>

<script>
  // Google E-Tablolar'daki dosyaya canlı bağlanır (herkese açık görüntüleme linki).
  const SHEET_ID = "1v3zbukkH5HS7tgx5bGifPOqdLMWpHFEV";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${Date.now()}`;
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

  // Minimal CSV parser (tırnaklı alanları ve virgülleri destekler).
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; }
          else inQuotes = false;
        } else cell += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c === "\r") { /* skip */ }
        else cell += c;
      }
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // "100.000 TL" -> 100000  (Türkçe: nokta binlik, virgül ondalık)
  function toNumber(s) {
    if (s == null) return null;
    const cleaned = String(s).replace(/[^\d.,-]/g, "").replace(/\./g, "").replace(",", ".");
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }

  // Bir satırda etiketi bulup aynı satırdaki ilk sayıyı döndürür.
  function findValue(rows, keyword) {
    for (const r of rows) {
      const idx = r.findIndex(c => c && c.toLocaleLowerCase("tr").includes(keyword));
      if (idx !== -1) {
        for (let j = idx + 1; j < r.length; j++) {
          const n = toNumber(r[j]);
          if (n != null) return n;
        }
      }
    }
    return null;
  }

  function render({ target, collected, remaining }) {
    const pct = target > 0 ? Math.min(100, (collected / target) * 100) : 0;
    const pctRounded = Math.round(pct);
    const R = 92, C = 2 * Math.PI * R;
    const offset = C * (1 - pct / 100);

    document.getElementById("card").innerHTML = `
      <div class="ring-wrap">
        <div class="ring">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7E5BEF"/>
                <stop offset="100%" stop-color="#C9A8FF"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="100" cy="100" r="${R}" fill="none" stroke-width="14"/>
            <circle class="bar" cx="100" cy="100" r="${R}" fill="none" stroke-width="14"
              stroke-dasharray="${C}" stroke-dashoffset="${C}" id="bar"/>
          </svg>
          <div class="center">
            <div class="pct">${pctRounded}<span>%</span></div>
            <div class="pct-label">Tamamlandı</div>
          </div>
        </div>
      </div>
    `;
    // Halkayı canlandır
    requestAnimationFrame(() => {
      const bar = document.getElementById("bar");
      if (bar) bar.style.strokeDashoffset = offset;
    });

    document.getElementById("updated").innerHTML =
      `Son güncelleme: ${new Date().toLocaleString("tr-TR")} · <a href="${SHEET_URL}" target="_blank" rel="noopener">Kaynak tablo</a>`;
  }

  async function load() {
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = parseCSV(await res.text());

      let target = findValue(rows, "hedef");
      let collected = findValue(rows, "toplanan");
      let remaining = findValue(rows, "kalan");

      if (target == null || collected == null) throw new Error("Veri okunamadı");
      if (remaining == null) remaining = Math.max(0, target - collected);

      render({ target, collected, remaining });
    } catch (err) {
      document.getElementById("state").outerHTML =
        `<div class="state error">Tabloya bağlanılamadı.<br><small>${err.message}</small></div>`;
    }
  }

  load();
  // Her 60 saniyede bir tabloyu yeniler
  setInterval(load, 60000);
</script>
</body>
</html>
